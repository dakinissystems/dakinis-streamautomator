# Gitleaks — allowlist for false positives (examples / placeholders).
# Docs: https://github.com/gitleaks/gitleaks
# Real secrets in git history must be rotated + purged — allowlist is NOT enough.
title = "dakinis gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures, examples, and documentation placeholders"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\..*\.example$''',
  '''(^|/).*\.dakinis-keys\.example\.json$''',
  '''(^|/)docs/.*\.md$''',
  '''(^|/).*README.*\.md$''',
  '''(^|/)API_READY\.md$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)node_modules/''',
  '''(^|/)backups/''',
  '''(^|/)\.git/''',
]
regexes = [
  '''(?i)example[_-]?key''',
  '''(?i)your[_-]?api[_-]?key''',
  '''(?i)changeme''',
  '''(?i)placeholder''',
  '''sk_test_placeholder''',
  # Local/dev sample API keys in docs
  '''(?i)dakinis-(dev|read)-key''',
  # Spanish placeholder values in old deploy guides (tu-…)
  '''(?i)tu-[a-z0-9._-]{4,}''',
  # Password-generation alphabet (not a secret)
  '''ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789''',
]

name: Architecture Checks

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read
  packages: read

jobs:
  frontend-architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check:architecture
      - name: Production build
        run: CI=true npm run build
      - name: Unit tests
        run: CI=true npm test -- --watchAll=false --passWithNoTests

  backend-architecture-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm bundled with Node 20 hits arborist edgesOut crash on this tree;
          # npm >= 11.6.0 has the peer-edge guard (npm/cli#8448).
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@dakinissystems"
      - name: Ensure npm with edgesOut fix
        run: npm install -g npm@11.6.2
      - name: Install from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN != '' && secrets.NODE_AUTH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
          npm --version
          npm install --no-audit --no-fund || install_rc=$?
          if [ "${install_rc:-0}" -ne 0 ]; then
            echo "::error::npm install failed."
            echo "If 403: set repo secret NODE_AUTH_TOKEN (PAT read:packages) or grant Actions Read on the four packages."
            echo "If edgesOut: need npm >= 11.6.0 (this job pins 11.6.2)."
            exit "${install_rc}"
          fi
      - run: npm run check:architecture
      - run: npm run smoke:baseline
      - name: Unit tests
        run: npm test -- --run

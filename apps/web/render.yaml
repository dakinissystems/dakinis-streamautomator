# Build settings
buildCommand: npm install && npm run build
startCommand: npx serve -s dist -l $PORT

# Environment variables (VITE_* preferred; REACT_APP_* still supported via Vite define shim)
envVars:
  - NODE_ENV=production
  - VITE_API_URL=https://stream-schedule-api.onrender.com
  - VITE_FRONTEND_URL=https://streamautomator.com
